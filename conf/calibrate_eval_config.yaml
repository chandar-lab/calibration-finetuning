defaults:
  - model: qwen3_1p7b
  - data: calibrate_sft_selected
  - train: calibrate_sft
  - experiment: calibrate_sft_eval_selected
  - eval_target: calibrate_sft_qwen3_1p7b_baseline_paper
  - inference: hf
  - inference_method: none
