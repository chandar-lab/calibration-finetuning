dataset_name: calibrate_sft
protocol: independent
quantile_low: 0.001
quantile_high: 0.999
num_decimals: 2
max_bins: 1001
tail_policy: clip_to_edge_bin
linspace_points_1d: 11
linspace_points_2d_per_axis: 11
train_max_specs_per_family: 121
test_unseen_max_specs_per_family: 36
ood_max_specs_per_family: 36
eval_prompt_selection: full_grid
train_families:
  - uniform
  - gaussian
  - beta
  - binomial
  - exponential
  - geometric
  - negative_binomial
  - lognormal
  - triangular
  - rayleigh
  - cauchy
  - student_t
  - chi_square
  - f_distribution
  - gamma
  - laplace
  - logistic
  - pareto
  - hypergeometric
  - gumbel
  - skellam
  - beta_binomial
  - lomax
  - inverse_gaussian
heldout_families:
  - bernoulli
  - poisson
  - weibull
  - maxwell
  - chi
  - truncnorm
families:
  uniform:
    train:
      max_specs: 121
      a:
        min: -5.0
        max: 2.0
        num_points: 11
      width:
        min: 1.0
        max: 5.0
        num_points: 11
    test_unseen:
      max_specs: 36
      a:
        min: 2.5
        max: 4.5
        num_points: 6
      width:
        min: 5.5
        max: 8.0
        num_points: 6
    test_selected:
      - a: 3.5
        width: 7.0
  gaussian:
    train:
      max_specs: 121
      mu:
        min: -2.0
        max: 2.0
        num_points: 11
      sigma:
        min: 0.5
        max: 2.0
        num_points: 11
        spacing: logspace
    test_unseen:
      max_specs: 36
      mu:
        min: 2.5
        max: 4.0
        num_points: 6
      sigma:
        min: 2.25
        max: 3.5
        num_points: 6
        spacing: logspace
    test_selected:
      - mu: 3.5
        sigma: 3.0
  beta:
    train:
      max_specs: 121
      alpha:
        min: 0.5
        max: 5.0
        num_points: 11
        spacing: logspace
      beta:
        min: 0.5
        max: 5.0
        num_points: 11
        spacing: logspace
    test_unseen:
      max_specs: 36
      alpha:
        min: 5.5
        max: 8.0
        num_points: 6
        spacing: logspace
      beta:
        min: 5.5
        max: 8.0
        num_points: 6
        spacing: logspace
    test_selected:
      - alpha: 7.0
        beta: 7.0
  bernoulli:
    ood:
      max_specs: 5
      p:
        values: [0.1, 0.3, 0.5, 0.7, 0.9]
    ood_selected:
      - p: 0.1
      - p: 0.5
      - p: 0.9
  binomial:
    train:
      max_specs: 44
      n:
        values: [5, 10, 15, 20]
      p:
        values: [0.2, 0.25, 0.3, 0.35, 0.4, 0.5, 0.6, 0.65, 0.7, 0.75, 0.8]
    test_unseen:
      max_specs: 10
